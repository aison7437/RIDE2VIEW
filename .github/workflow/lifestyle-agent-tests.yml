name: Lifestyle Agent Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-lifestyle-agent:
    name: Test Lifestyle Agent
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # NODE.JS
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------
      # VERIFY ENVIRONMENT
      # --------------------------------------------------
      - name: Verify Node.js version
        run: |
          node --version
          npm --version

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: ai/user/lifestyle-agent
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Skipping npm dependency installation."
          fi

      # --------------------------------------------------
      # BASELINE TEST
      # --------------------------------------------------
      - name: Run Lifestyle Agent baseline test
        working-directory: ai/user/lifestyle-agent
        run: node test.js

      # --------------------------------------------------
      # SCENARIO TEST SUITE
      # --------------------------------------------------
      - name: Run Lifestyle Agent scenario tests
        working-directory: ai/user/lifestyle-agent
        run: node scenario-test.js

      # --------------------------------------------------
      # FINAL STATUS
      # --------------------------------------------------
      - name: Lifestyle Agent test summary
        if: always()
        run: |
          echo "=============================================="
          echo "RIDE2VIEW LIFESTYLE AGENT CI"
          echo "=============================================="
          echo "Baseline test: executed"
          echo "Scenario test suite: executed"
          echo "=============================================="
