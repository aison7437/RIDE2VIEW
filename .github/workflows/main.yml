name: Ride2View Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: V10-B local operational acceptance gate
        run: npm run test:acceptance
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-b-acceptance-${{ github.sha }}
          path: acceptance-evidence/
          if-no-files-found: error
