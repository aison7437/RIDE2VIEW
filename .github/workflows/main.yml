name: Ride2View Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Check all JavaScript syntax
        run: npm run check
      - name: Test persistence, permissions, payments, and full journey
        run: npm test
      - name: Test existing Lifestyle Agent scenarios
        run: npm run test:agent
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test customer, administrator, and driver browser journey
        run: npm run test:browser
