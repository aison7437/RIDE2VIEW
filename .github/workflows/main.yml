name: Lifestyle Agent Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lifestyle-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run Lifestyle Agent tests
        working-directory: ai/user/lifestyle-agent
        run: node test.js
      - name: Run Lifestyle Agent scenario tests
        working-directory: ai/user/lifestyle-agent
        run: node scenario-test.js
