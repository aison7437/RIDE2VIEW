name: V11 Next.js frontend
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/v11-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/v11-web.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
