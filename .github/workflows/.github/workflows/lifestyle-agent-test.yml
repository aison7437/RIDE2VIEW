name: Ride2View Lifestyle Agent Test

on:
  push:
    paths:
      - "ai/user/lifestyle-agent/**"
  workflow_dispatch:

jobs:
  test-lifestyle-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lifestyle Agent test
        working-directory: ai/user/lifestyle-agent
        run: node test.js
