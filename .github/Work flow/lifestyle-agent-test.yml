name: Lifestyle Agent Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-lifestyle-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node.js version
        run: node --version

      - name: Run Lifestyle Agent test
        working-directory: ai/user/lifestyle-agent
        run: node test.js
