<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#1A4A2E">
<title>Ride2View Pro — Theme System + Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   ╔═══════════════════════════════════════════════╗
   ║   PART A — UI THEME SYSTEM                    ║
   ║   6 themes: white · black · gold · green      ║
   ║             pink · blue                       ║
   ╚═══════════════════════════════════════════════╝
══════════════════════════════════════════════════ */

/* ── THEME: GREEN (Default) ── */
[data-theme="green"] {
  --brand:        #1A4A2E;
  --brand-mid:    #256B42;
  --brand-light:  #3DAF66;
  --brand-faint:  #EAF5EE;
  --brand-faint2: #D0EAD9;
  --accent:       #3DAF66;
  --bg:           #F3F6F3;
  --bg2:          #EAEEE9;
  --card:         #FFFFFF;
  --surface:      #F6FAF7;
  --border:       rgba(26,74,46,0.13);
  --border2:      rgba(26,74,46,0.06);
  --ink:          #0D1F16;
  --ink2:         #3D5248;
  --ink3:         #7A9488;
  --ink4:         rgba(26,74,46,0.18);
  --nav-bg:       rgba(255,255,255,0.94);
  --sbar-bg:      #1A4A2E;
  --sbar-text:    #FFFFFF;
  --scheme: light;
}

/* ── THEME: WHITE ── */
[data-theme="white"] {
  --brand:        #1A1A2E;
  --brand-mid:    #2A2A4E;
  --brand-light:  #4A4AFF;
  --brand-faint:  #F0F0FF;
  --brand-faint2: #E0E0F8;
  --accent:       #4A4AFF;
  --bg:           #FFFFFF;
  --bg2:          #F5F5F7;
  --card:         #FFFFFF;
  --surface:      #F9F9FB;
  --border:       rgba(0,0,0,0.10);
  --border2:      rgba(0,0,0,0.05);
  --ink:          #000000;
  --ink2:         rgba(60,60,67,0.65);
  --ink3:         rgba(60,60,67,0.40);
  --ink4:         rgba(60,60,67,0.16);
  --nav-bg:       rgba(255,255,255,0.97);
  --sbar-bg:      #1A1A2E;
  --sbar-text:    #FFFFFF;
  --scheme: light;
}

/* ── THEME: BLACK ── */
[data-theme="black"] {
  --brand:        #1C1C1E;
  --brand-mid:    #2C2C2E;
  --brand-light:  #32D74B;
  --brand-faint:  #1C2E1C;
  --brand-faint2: #243024;
  --accent:       #32D74B;
  --bg:           #000000;
  --bg2:          #1C1C1E;
  --card:         #2C2C2E;
  --surface:      #3A3A3C;
  --border:       rgba(255,255,255,0.10);
  --border2:      rgba(255,255,255,0.05);
  --ink:          #FFFFFF;
  --ink2:         rgba(255,255,255,0.65);
  --ink3:         rgba(255,255,255,0.40);
  --ink4:         rgba(255,255,255,0.16);
  --nav-bg:       rgba(28,28,30,0.96);
  --sbar-bg:      #000000;
  --sbar-text:    #FFFFFF;
  --scheme: dark;
}

/* ── THEME: GOLD ── */
[data-theme="gold"] {
  --brand:        #7A5000;
  --brand-mid:    #9A6800;
  --brand-light:  #D4A017;
  --brand-faint:  #FFF8E6;
  --brand-faint2: #FFEFC0;
  --accent:       #D4A017;
  --bg:           #FDFAF0;
  --bg2:          #F5EDD0;
  --card:         #FFFFFF;
  --surface:      #FEFBF0;
  --border:       rgba(122,80,0,0.13);
  --border2:      rgba(122,80,0,0.06);
  --ink:          #2A1800;
  --ink2:         #6A4A00;
  --ink3:         #A08040;
  --ink4:         rgba(122,80,0,0.18);
  --nav-bg:       rgba(255,252,235,0.96);
  --sbar-bg:      #7A5000;
  --sbar-text:    #FFFFFF;
  --scheme: light;
}

/* ── THEME: PINK ── */
[data-theme="pink"] {
  --brand:        #A0004A;
  --brand-mid:    #C0006A;
  --brand-light:  #FF2D78;
  --brand-faint:  #FFF0F4;
  --brand-faint2: #FFD6E8;
  --accent:       #FF2D78;
  --bg:           #FFF5F8;
  --bg2:          #FFE8F0;
  --card:         #FFFFFF;
  --surface:      #FFF9FC;
  --border:       rgba(160,0,74,0.12);
  --border2:      rgba(160,0,74,0.06);
  --ink:          #300018;
  --ink2:         #800040;
  --ink3:         #C07090;
  --ink4:         rgba(160,0,74,0.16);
  --nav-bg:       rgba(255,249,252,0.96);
  --sbar-bg:      #A0004A;
  --sbar-text:    #FFFFFF;
  --scheme: light;
}

/* ── THEME: BLUE ── */
[data-theme="blue"] {
  --brand:        #0040A0;
  --brand-mid:    #0050C8;
  --brand-light:  #007AFF;
  --brand-faint:  #EEF4FF;
  --brand-faint2: #D8E8FF;
  --accent:       #007AFF;
  --bg:           #F0F4FF;
  --bg2:          #E0EBFF;
  --card:         #FFFFFF;
  --surface:      #F5F8FF;
  --border:       rgba(0,64,160,0.12);
  --border2:      rgba(0,64,160,0.05);
  --ink:          #001040;
  --ink2:         #204080;
  --ink3:         #6090C0;
  --ink4:         rgba(0,64,160,0.16);
  --nav-bg:       rgba(240,244,255,0.96);
  --sbar-bg:      #0040A0;
  --sbar-text:    #FFFFFF;
  --scheme: light;
}

/* ══ UNIVERSAL TOKENS (not theme-dependent) ══ */
:root {
  /* Ride tier colors — fixed, not themed */
  --tier-g:   #1A4A2E; --tier-g-l: #3DAF66; --tier-g-bg: #EAF5EE;
  --tier-w:   #B02040; --tier-w-l: #E04060; --tier-w-bg: #FFF0F2;
  --tier-s:   #1050A0; --tier-s-l: #3A82E0; --tier-s-bg: #EEF4FF;
  --tier-v:   #7A3800; --tier-v-l: #D4780A; --tier-v-bg: #FFF4E8;
  /* Semantic colors */
  --gold:     #C8960C;
  --gold-lgt: #F0C040;
  --orange:   #E8650A;
  --red:      #E03030;
  --indigo:   #5856D6;
  /* Shadows */
  --sh-xs:    0 1px 4px rgba(0,0,0,0.06);
  --sh-sm:    0 2px 12px rgba(0,0,0,0.08);
  --sh-md:    0 8px 28px rgba(0,0,0,0.10);
  --sh-lg:    0 20px 60px rgba(0,0,0,0.14);
  /* Radii */
  --r-xs:4px; --r-sm:12px; --r:18px; --r-lg:24px;
  /* Transitions */
  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease:   cubic-bezier(0.25,0.46,0.45,0.94);
}

/* ══ RESET & BASE ══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,'DM Sans',sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overscroll-behavior:none;
  transition:background .3s,color .3s;
}

/* ══════════════════════════════════════════════════
   RESPONSIVE SHELL — mobile-first, fits any screen
══════════════════════════════════════════════════ */
.shell{
  max-width:430px;width:100%;height:100vh;height:100dvh;margin:0 auto;
  background:var(--bg);display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  transition:background .3s;
}
@media(min-width:600px){
  body{background:#2A2A2A;display:flex;align-items:flex-start;justify-content:center;padding:20px 0 40px;}
  .shell{border-radius:44px;box-shadow:0 0 0 10px #111,var(--sh-lg);min-height:auto;}
  [data-theme="black"] body{background:#111;}
}
@media(min-width:1024px){body{align-items:center;min-height:100vh;}}

/* STATUS BAR */
.sbar{
  background:var(--sbar-bg);padding:14px 22px 0;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;color:var(--sbar-text);flex-shrink:0;
  transition:background .3s;
}
.sbar-time{font-size:15px;font-weight:700;}
.sbar-icons{display:flex;gap:5px;align-items:center;font-size:11px;}

/* ══════════════════════════════════════════════════
   BOTTOM TAB BAR — 6 tabs
══════════════════════════════════════════════════ */
.nav-bar{
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--border);
  padding:8px 0 max(18px,env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;align-items:flex-start;
  flex-shrink:0;width:100%;z-index:300;
  transition:background .3s,border-color .3s;
}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:4px 6px;min-width:48px;flex:1;transition:opacity .12s;}
.nav-item:active{opacity:.55;}
.nav-icon{font-size:22px;line-height:1;transition:transform .2s var(--spring);}
.nav-label{font-size:9px;font-weight:500;color:var(--ink3);letter-spacing:.1px;text-align:center;transition:color .3s;}
.nav-item.active .nav-label{color:var(--brand);font-weight:700;}
.nav-item.active .nav-icon{transform:scale(1.08);filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}

/* ══ SCREENS ══ */
.screen{display:none;flex-direction:column;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.screen::-webkit-scrollbar{display:none;}
.screen.active{display:flex;animation:scIn .3s var(--ease) both;}
@keyframes scIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ══ APP HEADER ══ */
.app-hdr{background:var(--brand);padding:16px 18px 20px;color:#fff;flex-shrink:0;transition:background .3s;}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;}
.logo-wrap{display:flex;align-items:center;gap:9px;}
.logo-mark{width:34px;height:34px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.18);}
.logo-text{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px;}
.hdr-btns{display:flex;gap:8px;}
.hbtn{width:34px;height:34px;background:rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;border:none;color:#fff;transition:background .15s;}
.hbtn:active{background:rgba(255,255,255,.3);}
.search-bar{background:rgba(255,255,255,.93);border-radius:13px;padding:11px 15px;display:flex;align-items:center;gap:9px;box-shadow:0 2px 12px rgba(0,0,0,.15);cursor:pointer;border:.5px solid rgba(255,255,255,.4);}
.search-ph{font-size:13px;color:var(--ink2);flex:1;transition:color .3s;}
.search-ic{width:28px;height:28px;background:var(--brand-faint);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.search-mic{width:28px;height:28px;background:var(--brand-faint);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0;transition:transform .15s,background .2s;}
.search-mic:active{transform:scale(.9);background:var(--brand-faint2);}
/* Voice entry point lives ONLY inside the search bar — any floating/duplicate
   mic button elsewhere in the app (legacy FAB from earlier builds) is hidden. */
.voice-fab,
#voice-fab,
button.voice-fab,
button#voice-fab,
[class*="voice-fab"]{display:none!important;}

/* ══ REUSABLE SECTION HEADER ══ */
.sec-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;margin-top:2px;}
.sec-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.4px;transition:color .3s;}
.sec-link{font-size:13px;font-weight:500;color:var(--brand);cursor:pointer;}

/* ══════════════════════════════════════════════════
   REUSABLE TIER BADGE COMPONENT
   Consistent across ALL screens — RIDE2GO + RIDE2VIEW
══════════════════════════════════════════════════ */
.tier-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:100px;
  font-size:10px;font-weight:700;letter-spacing:.2px;
  white-space:nowrap;flex-shrink:0;
}
.tbg{background:var(--tier-g-bg);color:var(--tier-g);}
.tbw{background:var(--tier-w-bg);color:var(--tier-w);}
.tbs{background:var(--tier-s-bg);color:var(--tier-s);}
.tbv{background:var(--tier-v-bg);color:var(--tier-v-l);}

/* ══ CARD ══ */
.card-base{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);box-shadow:var(--sh-xs);transition:background .3s,border-color .3s;}

/* ══ BUTTON ══ */
.btn-primary{background:var(--brand);color:#fff;border:none;border-radius:var(--r-sm);padding:14px 22px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);transition:transform .15s var(--spring),background .3s;}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{background:transparent;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:13px 20px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);transition:border-color .15s,color .15s;}
.btn-secondary:hover{border-color:var(--brand);color:var(--brand);}

/* ══════════════════════════════════════════════════
   HOME SCREEN
══════════════════════════════════════════════════ */
.home-body{padding:16px;background:var(--bg);transition:background .3s;}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.mcard{border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;border:none;text-align:left;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;display:flex;flex-direction:column;justify-content:flex-end;min-height:148px;box-shadow:0 8px 28px rgba(0,0,0,.25);}
.mcard:active{transform:scale(.97);}
.mcard .mc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .5s ease;z-index:0;}
.mcard:hover .mc-bg{transform:scale(1.06);}
.mc-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;}
.mcard.go .mc-overlay{background:linear-gradient(170deg,rgba(0,10,60,.4) 0%,rgba(0,40,140,.2) 40%,rgba(0,0,0,.72) 100%);}
.mcard.view .mc-overlay{background:linear-gradient(170deg,rgba(0,30,10,.35) 0%,rgba(10,60,25,.2) 40%,rgba(0,0,0,.72) 100%);}
.mc-content{position:relative;z-index:2;padding:12px 13px 6px;}
.mc-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:100px;padding:3px 9px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;margin-bottom:5px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.mc-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:800;letter-spacing:-.4px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);line-height:1.1;}
.mc-sub{font-size:10px;color:rgba(255,255,255,.75);margin-top:3px;font-weight:500;}
.mc-tiers{position:relative;z-index:2;display:flex;gap:4px;padding:7px 13px 13px;flex-wrap:wrap;}
.mc-arrow{position:absolute;top:13px;right:13px;z-index:3;width:26px;height:26px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
/* tier badges row on mode cards */
.mc-tiers{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;}
.mc-tiers .tier-badge{font-size:9px;padding:3px 7px;}

/* FEAT SCROLL */
.feat-scroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px;}
.feat-scroll::-webkit-scrollbar{display:none;}
.feat-card{flex-shrink:0;width:205px;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;border:.5px solid var(--border);transition:transform .18s var(--spring),background .3s;}
.feat-card:active{transform:scale(.97);}
.feat-img{width:100%;height:126px;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;overflow:hidden;}
.feat-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);padding:10px 10px 8px;}
.fbadge{display:inline-block;padding:3px 8px;border-radius:100px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.bp{background:var(--gold-lgt);color:#000;}.bn{background:#3DAF66;color:#fff;}.bh{background:var(--red);color:#fff;}
.feat-body{padding:11px 12px 14px;}
.ftitle{font-weight:600;font-size:13px;line-height:1.35;color:var(--ink);transition:color .3s;}
.floc{font-size:11px;color:var(--ink2);margin-top:3px;transition:color .3s;}
.fbtm{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.fprice{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--brand);transition:color .3s;}
.fstars{font-size:10px;color:var(--gold);}

/* CAT GRID */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.citem{background:var(--card);border-radius:var(--r-sm);padding:13px 6px;text-align:center;cursor:pointer;border:.5px solid var(--border);box-shadow:var(--sh-xs);transition:transform .15s var(--spring),background .3s;}
.citem:active{transform:scale(.96);}
.cicon{font-size:22px;margin-bottom:5px;display:block;}
.cname{font-size:10px;font-weight:500;color:var(--ink2);line-height:1.3;transition:color .3s;}
.ccount{font-size:9px;color:var(--ink3);margin-top:2px;transition:color .3s;}

/* SUGGESTED */
.sug-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;}
.sug-tabs::-webkit-scrollbar{display:none;}
.stab{flex-shrink:0;padding:6px 14px;background:var(--bg2);border-radius:100px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;border:none;transition:all .15s;}
.stab.active{background:var(--ink);color:var(--bg);}
[data-theme="black"] .stab.active{background:var(--brand-light);color:#000;}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 -16px;padding:0 16px 4px;}
.scard{background:var(--card);border-radius:var(--r-sm);overflow:hidden;cursor:pointer;box-shadow:var(--sh-xs);border:.5px solid var(--border);transition:transform .18s var(--spring),background .3s;}
.scard:active{transform:scale(.97);}
.scard-img{width:100%;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;overflow:hidden;}
.scard-img.tall{height:158px;}.scard-img.short{height:108px;}
.scard-body{padding:9px 11px 11px;}
.sc-type{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.sc-title{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;}
.sc-sub{font-size:10px;color:var(--ink2);margin-top:2px;}
.sc-price{font-size:12px;font-weight:700;color:var(--brand);margin-top:5px;}
.sc-pill{display:inline-flex;align-items:center;gap:4px;background:var(--brand-faint);border-radius:100px;padding:3px 8px;font-size:9px;font-weight:700;color:var(--brand);margin-top:5px;}

/* ══════════════════════════════════════════════════
   BROWSE SCREEN
══════════════════════════════════════════════════ */
.browse-hdr{background:var(--brand);padding:16px 18px 18px;color:#fff;flex-shrink:0;transition:background .3s;}
.browse-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:13px;letter-spacing:-.5px;}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:6px 14px;background:rgba(255,255,255,.15);border-radius:100px;font-size:11px;font-weight:600;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.22);white-space:nowrap;transition:all .15s;}
.chip.active{background:#fff;color:var(--brand);border-color:#fff;}
.browse-body{padding:14px;background:var(--bg);transition:background .3s;}
.prop-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.pimg{width:100%;height:108px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden;}

.pprice{font-size:13px;font-weight:700;color:var(--brand);font-family:'Playfair Display',serif;transition:color .3s;}

.rrow{display:flex;gap:9px;}
.rinput{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;font-family:inherit;color:var(--ink);}
.apply-btn{width:100%;padding:14px;background:var(--brand);color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}

/* ══════════════════════════════════════════════════
   PROPERTY DETAIL
══════════════════════════════════════════════════ */
.dhero{width:100%;height:240px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;overflow:hidden;flex-shrink:0;}
.dback{position:absolute;top:14px;left:14px;width:34px;height:34px;background:rgba(255,255,255,.88);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;backdrop-filter:blur(12px);}
.dactions{position:absolute;top:14px;right:14px;display:flex;gap:8px;}
.dcounter{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.48);color:#fff;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:600;}
.dbody{padding:18px;flex:1;overflow-y:auto;background:var(--bg);transition:background .3s;}
.drating-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.drating-circle{width:48px;height:48px;background:var(--brand);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);flex-shrink:0;transition:background .3s;}
.rbig{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;line-height:1;}.rsmall{font-size:7px;opacity:.75;}
.dtitle{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;line-height:1.2;color:var(--ink);letter-spacing:-.5px;}
.dprice{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--brand);margin-top:4px;transition:color .3s;}

.dloc{font-size:13px;color:var(--ink2);margin-top:5px;}
.dstars-row{display:flex;align-items:center;gap:4px;margin-top:5px;}
.dstars{color:var(--gold);font-size:14px;}.dstarnum{font-weight:700;font-size:12px;}.drevs{font-size:12px;color:var(--ink2);}
.specs-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0;}
.sbox{background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:10px 5px;text-align:center;box-shadow:var(--sh-xs);transition:background .3s;}
.sicon{font-size:18px;}.sval{font-size:13px;font-weight:700;margin-top:3px;color:var(--ink);}.slbl{font-size:9px;color:var(--ink3);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}

/* ── AI INTELLIGENCE WIDGETS ── */
.intel-row{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap;}
.match-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#1A4A2E,#3DAF66);color:#fff;border-radius:100px;padding:6px 13px;font-size:12px;font-weight:800;box-shadow:0 3px 10px rgba(26,74,46,.3);}
.match-badge .mb-pct{font-family:'Playfair Display',serif;font-size:14px;}
.readiness-badge{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:6px 12px;font-size:11px;font-weight:700;}
.readiness-badge.ready{background:#E8F5ED;color:#1A4A2E;}
.readiness-badge.prep{background:#FFF4E0;color:#B86A00;}
.activity-line{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);margin:8px 0 14px;}
.activity-dot{width:6px;height:6px;border-radius:50%;background:#FF9500;box-shadow:0 0 0 3px rgba(255,149,0,.18);flex-shrink:0;}
.why-panel{background:var(--brand-faint);border:.5px solid var(--brand-faint2);border-radius:14px;padding:13px 14px;margin:14px 0;cursor:pointer;transition:background .3s;}
.why-hdr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--brand);}
.why-arrow{margin-left:auto;font-size:13px;transition:transform .25s;color:var(--brand);}
.why-panel.open .why-arrow{transform:rotate(180deg);}
.why-body{display:none;margin-top:10px;padding-top:10px;border-top:.5px solid var(--brand-faint2);}
.why-panel.open .why-body{display:block;}
.why-item{display:flex;gap:7px;font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:7px;}
.why-item:last-child{margin-bottom:0;}
.area-feel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
.feel-box{background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:11px 8px;text-align:center;}
.feel-lbl{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;}
.feel-bar-track{height:5px;background:var(--bg);border-radius:100px;overflow:hidden;margin-bottom:5px;}
.feel-bar-fill{height:100%;border-radius:100px;transition:width .6s var(--spring);}
.feel-val{font-size:11px;font-weight:700;color:var(--ink);}
.book-later-btn{background:transparent;border:1.5px solid var(--border);color:var(--ink2);border-radius:14px;padding:14px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:border-color .15s,color .15s;}
.book-later-btn:active{transform:scale(.97);}

/* ── WHO IS THIS RIDE FOR ── */
.whofor-row{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
.whofor-row::-webkit-scrollbar{display:none;}
.whofor-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;cursor:pointer;transition:all .15s;min-width:64px;}
.whofor-chip.active{border-color:var(--brand);background:var(--brand-faint);}
.whofor-icon{font-size:18px;}
.whofor-lbl{font-size:10px;font-weight:600;color:var(--ink2);}
.whofor-chip.active .whofor-lbl{color:var(--brand);font-weight:700;}

/* ── FARE TRANSPARENCY ── */
.fare-toggle{font-size:11px;color:var(--blue,#007AFF);font-weight:600;cursor:pointer;text-align:center;margin:-4px 0 12px;}
.fare-breakdown{display:none;background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.fare-breakdown.open{display:block;}
.fb-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:5px 0;}
.fb-row.total{border-top:.5px solid var(--border);margin-top:5px;padding-top:8px;font-weight:700;color:var(--ink);}

/* ── TRIP CONFIDENCE ── */
.confidence-box{background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:14px;margin:14px 0;}
.confidence-title{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
.confidence-item{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink);padding:5px 0;}
.confidence-check{color:#34C759;font-size:14px;}
.arrived-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;transition:background .3s;}
.arrived-btn:active{transform:scale(.98);}

.divider{height:.5px;background:var(--border);margin:14px 0;}
.subsec{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;margin-bottom:10px;color:var(--ink);letter-spacing:-.3px;}
.achip-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.achip{display:flex;align-items:center;gap:5px;background:var(--brand-faint);border-radius:100px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--brand);transition:background .3s,color .3s;}
.host-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;border:.5px solid var(--border);box-shadow:var(--sh-xs);transition:background .3s;}
.havatar{width:44px;height:44px;border-radius:50%;background:var(--brand-faint2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:2px solid var(--brand-light);}
.hname{font-weight:700;font-size:14px;color:var(--ink);}.htitle{font-size:11px;color:var(--ink2);margin-top:2px;}
.hcontact{margin-left:auto;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .3s;}
.revcard{background:var(--card);border-radius:14px;padding:13px;margin-bottom:9px;border:.5px solid var(--border);box-shadow:var(--sh-xs);transition:background .3s;}
.rev-hdr{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.rev-av{width:34px;height:34px;border-radius:50%;background:var(--brand-faint2);display:flex;align-items:center;justify-content:center;font-size:15px;}
.rev-name{font-size:12px;font-weight:700;color:var(--ink);}.rev-loc{font-size:10px;color:var(--ink3);}
.rev-stars{margin-left:auto;color:var(--gold);font-size:12px;}.rev-text{font-size:12px;color:var(--ink2);line-height:1.6;}
.book-bar{background:var(--nav-bg);backdrop-filter:blur(20px);border-top:.5px solid var(--border);padding:13px 18px max(20px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;flex-shrink:0;}
.bprice-col{flex:1;}.bprice-lg{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--brand);transition:color .3s;}.bprice-sub{font-size:10px;color:var(--ink3);}
.book-btn{background:var(--brand);color:#fff;border:none;border-radius:14px;padding:14px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap;transition:transform .15s var(--spring),background .3s;}
.book-btn:active{transform:scale(.97);}

/* ══════════════════════════════════════════════════
   RIDE SCREEN — Tier badges shown at every step
══════════════════════════════════════════════════ */
.ride-map{background:linear-gradient(135deg,#b8d8c4,#94c4a8);height:200px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;}
.ride-map::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 30px,rgba(26,74,46,.06) 30px,rgba(26,74,46,.06) 31px),repeating-linear-gradient(90deg,transparent,transparent 30px,rgba(26,74,46,.06) 30px,rgba(26,74,46,.06) 31px);}
.ride-pin{width:50px;height:50px;background:#0070FF;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,112,255,.5);position:relative;}
.ride-pin::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(0,112,255,.28);animation:ripple 1.6s ease-out infinite;}
.ride-pin span{transform:rotate(45deg);font-size:22px;}
@keyframes ripple{0%{transform:scale(1);opacity:.7;}100%{transform:scale(2);opacity:0;}}
.ride-body{padding:16px;overflow-y:auto;background:var(--bg);transition:background .3s;}
/* Tier strip on ride step 1 */
.tier-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:14px;}
.tier-strip::-webkit-scrollbar{display:none;}
.ride-input-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh-sm);margin-bottom:14px;border:.5px solid var(--border);transition:background .3s;}

/* ══════════════════════════════════════════════════════
   8-STEP RIDE FUNNEL — clean, explicit, crisp
══════════════════════════════════════════════════════ */
.rstep-hdr{background:var(--brand);padding:14px 18px 16px;flex-shrink:0;transition:background .3s;}
.rstep-toprow{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.rstep-back{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;}
.rstep-label{flex:1;}
.rstep-num{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.55);}
.rstep-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:800;color:#fff;line-height:1.1;margin-top:1px;}
.rstep-skip{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer;white-space:nowrap;}
.rstep-bar{display:flex;gap:4px;}
.rstep-seg{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.18);transition:background .35s;}
.rstep-seg.done{background:#fff;}
.rstep-seg.active{background:linear-gradient(90deg,#fff,rgba(255,255,255,.5));}

.rstep-panel{display:none;flex:1;overflow-y:auto;background:var(--bg);}
.rstep-panel.active{display:flex;flex-direction:column;animation:scIn .3s var(--ease) both;}
.rstep-body{padding:18px;flex:1;}
.rstep-cta{background:var(--card);border-top:.5px solid var(--border);padding:14px 18px max(18px,env(safe-area-inset-bottom));flex-shrink:0;}
.rstep-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s var(--spring),background .3s;}
.rstep-btn:active{transform:scale(.97);}
.rstep-btn:disabled{opacity:.4;cursor:not-allowed;}
.rstep-btn-ghost{width:100%;padding:13px;border:1.5px solid var(--border);border-radius:14px;background:transparent;color:var(--ink2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}

/* Step 1 — who for, big tappable grid */
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.who-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;transition:all .18s var(--spring);}
.who-card.sel{border-color:var(--brand);background:var(--brand-faint);box-shadow:0 0 0 1px var(--brand);}
.who-card:active{transform:scale(.96);}
.who-emoji{font-size:28px;margin-bottom:8px;}
.who-name{font-size:13px;font-weight:700;color:var(--ink);}
.who-note{font-size:10px;color:var(--ink3);margin-top:3px;line-height:1.4;}

/* Step 3 — smart default spotlight */
.spotlight-wrap{text-align:center;padding:6px 0 18px;}
.spotlight-tag{display:inline-flex;align-items:center;gap:6px;background:var(--brand-faint);color:var(--brand);font-size:11px;font-weight:800;padding:6px 14px;border-radius:100px;margin-bottom:16px;}
.spotlight-card{background:var(--card);border:2px solid var(--brand);border-radius:22px;padding:26px 20px;box-shadow:0 14px 36px rgba(0,0,0,.14);position:relative;overflow:hidden;}
.spotlight-card::before{content:'';position:absolute;top:-50px;right:-50px;width:130px;height:130px;border-radius:50%;background:var(--brand-faint);}
.spotlight-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand-mid));display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;box-shadow:0 8px 20px rgba(0,0,0,.18);position:relative;z-index:1;}
.spotlight-name{font-family:'Playfair Display',serif;font-size:21px;font-weight:800;color:var(--ink);position:relative;z-index:1;}
.spotlight-price{font-size:24px;font-weight:800;color:var(--brand);margin-top:4px;position:relative;z-index:1;}
.spotlight-why{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.6;position:relative;z-index:1;}
.spotlight-other{text-align:center;font-size:12px;font-weight:700;color:var(--blue,#007AFF);margin-top:18px;cursor:pointer;}

/* Step 6 — finding driver radar */
.radar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:30px 24px;text-align:center;}
.radar-ring{position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;}
.radar-pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:.5;animation:radarPulse 1.8s ease-out infinite;}
.radar-pulse:nth-child(2){animation-delay:.6s;}
.radar-pulse:nth-child(3){animation-delay:1.2s;}
@keyframes radarPulse{0%{transform:scale(.5);opacity:.7;}100%{transform:scale(1.6);opacity:0;}}
.radar-core{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-mid));display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:1;}
.radar-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px;}
.radar-sub{font-size:12px;color:var(--ink2);margin-bottom:20px;}
.priority-list{background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:14px 16px;width:100%;max-width:280px;text-align:left;}
.priority-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);padding:6px 0;}
.priority-num{width:18px;height:18px;border-radius:50%;background:var(--brand-faint);color:var(--brand);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Step 8 — rating */
.rate-stars{display:flex;justify-content:center;gap:10px;margin:18px 0 22px;}
.rate-star{font-size:36px;cursor:pointer;filter:grayscale(1) opacity(.3);transition:filter .15s,transform .15s;}
.rate-star.on{filter:none;transform:scale(1.1);}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;}
.rate-tag{padding:8px 14px;border-radius:100px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .15s;}
.rate-tag.sel{border-color:var(--brand);background:var(--brand-faint);color:var(--brand);}

/* ── RIDE MODE: Taxi ⟷ Delivery — sliding segmented toggle ── */
.ride-mode-section{background:#15171C;border-radius:22px;padding:18px 16px 16px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.ride-mode-section::before{content:'';position:absolute;top:-60px;right:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,32,.18),transparent 70%);pointer-events:none;}
.rmt-toggle{position:relative;display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:4px;margin-bottom:18px;z-index:1;}

    return actionFn(result.entities||{});
  }

  /* ── LAYER 5: VOICE RESPONSE + RENDER ───────────────────── */
  const INTENT_LABELS = {
    PROPERTY_SEARCH:'🏠 Property Search', BOOK_RIDE:'🚗 Booking Ride', UPGRADE_TIER:'✨ Upgrading Tier',
    CONTACT_AGENT:'👩 Contacting Agent', VIP_PRIVATE_VIEWING:'👑 VIP Viewing', WOMEN_ONLY_RIDE:'🌸 SafeRide',
    STUDENT_RIDE:'🎓 Campus Ride', START_DELIVERY:'📦 Starting Delivery', CHECK_DRIVER_ETA:'📍 Checking ETA',
    TRIP_STATUS:'🗓️ Trip Status', START_TRIP:'▶️ Starting Trip', COMPLETE_TRIP:'✅ Completing Trip',
    ACCEPT_RIDE:'✅ Accepting Ride', NAVIGATE:'📍 Navigating', ARRIVED:'📍 Arrived',
    OPEN_RIDE_PLATE:'🍽️ Ride Plate', RESERVE_PROPERTY:'🔒 Reserve Property',
    SAVE_PROPERTY:'❤️ Saving Property', OPEN_INBOX:'💬 Opening Inbox',
  };

  const RESULT_COLORS = { card:'var(--brand)', ride:'#0070FF', success:'#34C759', info:'var(--brand)', vip:'#D4A820' };

  function renderResult(res) {
    const el = document.getElementById('voice-result');
    if (!el) return;
    const col = RESULT_COLORS[res.type]||'var(--brand)';
    el.innerHTML = `
      <div style="background:${col}10;border:.5px solid ${col}40;border-radius:16px;padding:14px 16px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="font-size:24px">${res.icon}</span>
          <div style="font-size:14px;font-weight:700;color:var(--ink)">${res.title}</div>
        </div>
        <div style="font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:12px">${res.body}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button onclick="${res.action||'VIS.close()'}" style="background:${col};color:white;border:none;border-radius:10px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${res.cta}</button>
          ${res.secondary?`<button onclick="${res.secAction||'VIS.close()'}" style="background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink2)">${res.secondary}</button>`:''}
        </div>
      </div>`;
    el.classList.add('show');
  }

  function speak(text, overrideSeg) {
    if (!ttsEnabled || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt  = new SpeechSynthesisUtterance(text);
    const seg  = overrideSeg || (typeof ridePlateSeg !== 'undefined' ? ridePlateSeg : 'general');

    // Segment-adaptive tone — Apple-grade voice UX
    const toneMap = {
      general: { rate:0.96, pitch:1.00, vol:1.00 },   // Warm, clear, conversational
      women:   { rate:0.88, pitch:1.06, vol:0.95 },    // Calm, reassuring, premium
      student: { rate:1.06, pitch:1.02, vol:1.00 },    // Energetic, fast, youthful
      vip:     { rate:0.80, pitch:0.94, vol:0.98 },    // Slow, deep, concierge luxury
    };
    const tone = toneMap[seg] || toneMap.general;
    utt.rate   = tone.rate;
    utt.pitch  = tone.pitch;
    utt.volume = tone.vol;

    // Voice selection — prefer native voices per segment
    const voices = speechSynthesis.getVoices();
    let pref;
    if (seg === 'vip') {
      pref = voices.find(v => /samantha|serena|karen|victoria|premium/i.test(v.name))
          || voices.find(v => v.lang === 'en-GB');
    } else if (seg === 'women') {
      pref = voices.find(v => /fiona|moira|veena|female|woman/i.test(v.name))
          || voices.find(v => /en-(KE|ZA|GB)/i.test(v.lang));
    } else {
      pref = voices.find(v => /google|daniel|alex|en-KE/i.test(v.name))
          || voices.find(v => v.lang.startsWith('en'));
    }
    if (pref) utt.voice = pref;

    // Analytics hook
    if (typeof VoiceAnalytics !== 'undefined') VoiceAnalytics.logTTS(text, seg);
    speechSynthesis.speak(utt);
  }

  function setStatus(msg, cls) {
    const el = document.getElementById('voice-status');
    if (!el) return;
    el.textContent = msg;
    el.className = 'voice-status' + (cls?' '+cls:'');
  }

  /* ── LAYER 1: WEB SPEECH API INPUT ─────────────────────── */
  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = 'en-KE'; r.continuous = false; r.interimResults = true; r.maxAlternatives = 3;
    // Noise suppression via AudioContext (echoCancellation, noiseSuppression)
    if (navigator.mediaDevices?.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true } }).then(s=>s.getTracks().forEach(t=>t.stop())).catch(()=>{});
    }
    r.onstart = () => {
      listening = true;
      _setListeningUI(true);
      setStatus('Listening…', 'active');
    };
    r.onresult = (e) => {
      const interim  = Array.from(e.results).filter(r=>!r.isFinal).map(r=>r[0].transcript).join('');
      const final_   = Array.from(e.results).filter(r=>r.isFinal).map(r=>r[0].transcript).join('');
      const show     = final_ || interim;
      const transcEl = document.getElementById('voice-transcript');
      if (transcEl) { transcEl.textContent = show; transcEl.classList.remove('empty'); }
      if (final_) _process(final_);
    };
    r.onerror = (e) => {
      const msgs = { 'no-speech':'No speech detected — try again', 'not-allowed':'Microphone access denied', 'network':'Network error' };
      setStatus(msgs[e.error]||'Error: '+e.error, 'error');
      _setListeningUI(false);
    };
    r.onend = () => { listening = false; _setListeningUI(false); if (document.getElementById('voice-status')?.textContent==='Listening…') setStatus('Ready — tap to speak'); };
    return r;
  }

  function _process(transcript) {
    setStatus('Analysing…');
    // Short delay for UX feel
    setTimeout(() => {
      const raw    = detectIntent(transcript);
      const result = enrichContext(raw);
      if (result) {
        result._transcript = transcript;
        // Show intent chip
        const ic = document.getElementById('voice-intent');
        const il = document.getElementById('voice-intent-label');
        const cf = document.getElementById('voice-confidence');
        if (ic && il) { ic.classList.add('show'); il.textContent = INTENT_LABELS[result.intent]||result.intent; if(cf) cf.textContent = Math.round(result.confidence*100)+'%'; }
        setStatus(`Executing: ${INTENT_LABELS[result.intent]||result.intent}`);
        pendingIntent = result;
        const actionResult = executeIntent(result);
        renderResult(actionResult);
        // TTS response
        const ttsMap = {
          PROPERTY_SEARCH:`Found properties in ${result.entities.location||'Nairobi'}.`,
          BOOK_RIDE:`Booking your ${result.entities.tier||'general'} ride. Please confirm.`,
          UPGRADE_TIER:`Upgrading to ${result.entities.tier}.`,
          CONTACT_AGENT:`Connecting you to your agent.`,
          VIP_PRIVATE_VIEWING:`Your private viewing has been reserved.`,
          CHECK_DRIVER_ETA:`Your driver James is 3 minutes away.`,
          OPEN_RIDE_PLATE:`Opening Ride Plate. What would you like to eat?`,
        };
        speak(ttsMap[result.intent]||actionResult.body?.split('\n')[0]);
        setStatus('Done ✓', 'active');
      } else {
        setStatus("Didn't catch that — try again", 'error');
        speak("Sorry, I didn't understand. Try saying: book a ride, or show properties in Kilimani.");
      }
    }, 350);
  }

  function _setListeningUI(on) {
    const fab  = document.getElementById('voice-fab');
    const mic  = document.getElementById('voice-mic-main');
    const ov   = document.getElementById('voice-overlay');
    if (fab) { fab.textContent = on?'⏹️':'🎙️'; fab.classList.toggle('listening', on); }
    if (mic) { mic.textContent = on?'⏹️':'🎙️'; mic.classList.toggle('listening', on); }
    if (ov)  ov.classList.toggle('listening', on);
  }

  /* ── PUBLIC API ─────────────────────────────────────────── */
  return {
    init() {
      // Pre-warm Speech Recognition engine
      recognition = initRecognition();
      // Announce voice is ready via subtle UI cue
      const fab = document.getElementById('voice-fab');
      if (fab) {
        fab.title = 'Voice Assistant ready — tap to speak';
        // Pulse once on load to signal readiness
        fab.style.transform = 'scale(1.12)';
        setTimeout(() => { fab.style.transform = ''; }, 400);
      }
    },
    open() {
      const ov = document.getElementById('voice-overlay');
      if (!ov) return;
      ov.classList.add('open');
      ov.setAttribute('data-seg', ridePlateSeg||'general');
      // Update title per segment
      const segLabels = { general:'General Mode', women:'SafeRide · Women Mode', student:'Campus Mode', vip:'Elite · Concierge Mode' };
      const segTitles = { general:'Voice Assistant', women:'Comfort Assistant', student:'Campus Assistant', vip:'Concierge' };
      const sl = document.getElementById('voice-seg-label'); if(sl) sl.textContent = segLabels[ridePlateSeg]||'General Mode';
      const st = document.getElementById('voice-title');    if(st) st.textContent = segTitles[ridePlateSeg]||'Voice Assistant';
      // Update suggestions per segment
      const sugs = {
        general: ['🚗 Book a ride to Kilimani','🏠 Show 2-bed apartments under 80K','🍔 I\'m hungry — open Ride Plate'],
        women:   ['🌸 Book a SafeRide','☕ Verified cafés near me','🏠 Show me property in Karen'],
        student: ['🎓 Campus ride please','🍕 Meals under 300','💸 Cheapest ride available'],
        vip:     ['👑 Book a private viewing','🥂 Executive dining nearby','🚘 Upgrade to Elite tier'],
      };
      const ss = document.querySelectorAll('.voice-sug');
      const s  = sugs[ridePlateSeg]||sugs.general;
      ss.forEach((el,i) => { if(s[i]){ el.textContent=s[i]; el.onclick=()=>this.inject(s[i].replace(/^[^\s]+\s/,'')); } });
      // Reset state
      const tr = document.getElementById('voice-transcript'); if(tr){tr.textContent='Tap the mic and speak…';tr.classList.add('empty');}
      const ic = document.getElementById('voice-intent'); if(ic) ic.classList.remove('show');
      const vr = document.getElementById('voice-result');  if(vr) vr.classList.remove('show');
      const vp = document.getElementById('voice-pay-confirm'); if(vp) vp.style.display='none';
      setStatus('Ready — tap to speak');
    },
    close() {
      VoiceAnalytics.endSession();
      const ov = document.getElementById('voice-overlay');
      if (ov) ov.classList.remove('open');
      if (listening && recognition) recognition.stop();
    },
    toggleListen() {
      if (!recognition) recognition = initRecognition();
      if (!recognition) {
        // Fallback: simulate with demo transcript
        this.inject(document.getElementById('voice-transcript')?.textContent||'book a ride');
        return;
      }
      if (listening) { recognition.stop(); }
      else { try { recognition.start(); } catch(e) { recognition = initRecognition(); recognition.start(); } }
    },
    inject(text) {
      // Programmatic input (quick suggestions, demo)
      const tr = document.getElementById('voice-transcript');
      if (tr) { tr.textContent = text; tr.classList.remove('empty'); }
      setStatus('Processing…');
      _process(text);
    },
    triggerPayment(amount, label) {
      const el = document.getElementById('voice-pay-confirm');
      const lb = document.getElementById('voice-pay-label');
      if (lb) lb.textContent = `Confirm ${amount} via M-Pesa`;
      if (el) el.style.display = 'block';
    },
    confirmPayment() {
      const el = document.getElementById('voice-pay-confirm');
      if (el) el.style.display = 'none';
      toast('✅ Payment confirmed via M-Pesa · Ride booked!');
      if (pendingIntent?.intent === 'BOOK_RIDE' || pendingIntent?.intent === 'WOMEN_ONLY_RIDE' || pendingIntent?.intent === 'STUDENT_RIDE') {
        bookedTrips.push({ title: INTENT_LABELS[pendingIntent.intent]||'Voice Booking', price: pendingIntent.entities?.fare||'KSh 350', location:'📍 Route via voice', img:'img-penthouse', emoji:'🚗' });
        renderTrips();
        setTimeout(()=>{ this.close(); goTo('trips'); }, 1200);
      }
    },

    toggle() {
      const ov = document.getElementById('voice-overlay');
      if (ov && ov.classList.contains('open')) this.close();
      else this.open();
    }
  };
})();


/* ════════════════════════════════════════════════════════════
   RIDE2VIEW VOICE INTELLIGENCE SYSTEM v2.0
   5-Layer Architecture:
   L1: Input  L2: Intent  L3: Context  L4: Execution  L5: Response
════════════════════════════════════════════════════════════ */

const VI = (() => {

  /* ── L1: STATE ─────────────────────────────────────── */
  let _open     = false;
  let _listening= false;
  let _sr       = null;       // SpeechRecognition instance
  let _synth    = window.speechSynthesis;
  let _lastResult = '';
  let _context  = {};         // L3 context snapshot
  let _sessionLog = [];       // analytics store

  /* ── L2: INTENT ENGINE ─────────────────────────────── */
  // Intent definitions: patterns → intent ID
  const INTENTS = [
    // PROPERTY
    { id:'PROPERTY_SEARCH',    emoji:'🏠', label:'Property Search',
      patterns:[/find|search|show|look|property|house|apartment|flat|bedsit|studio|villa|rent|buy|bedroom|bed|kilimani|westlands|karen|lavington|ngong|runda|muthaiga|kileleshwa/i],
      entities:(t)=>({
        location: (/kilimani|westlands|karen|lavington|ngong|runda|muthaiga|kileleshwa|upperhill|parklands/i.exec(t)||[])[0]||null,
        bedrooms: ((t.match(/(\d+)\s*bed/i)||[])[1]||null),
        budget:   ((t.match(/under\s*([\d,]+)|(\d{2,6})\s*k?sh/i)||[])[1]||(t.match(/(\d{2,6})/)||[])[1]||null),
        type:     (/apartment|flat/i.test(t)?'apartment':/villa/i.test(t)?'villa':/studio|bedsit/i.test(t)?'studio':null)
      })
    },
    { id:'BOOK_VIEWING',       emoji:'📅', label:'Book Viewing',
      patterns:[/book.*view|schedule.*view|arrange.*view|viewing/i],
      entities:(t)=>({ property: _context.lastProperty||null })
    },
    // RIDE
    { id:'BOOK_RIDE',          emoji:'🚗', label:'Book Ride',
      patterns:[/book.*ride|get.*ride|call.*driver|need.*taxi|request.*car|pick.*up/i],
      entities:(t)=>({
        tier: _detectTier(t),
        destination: _context.lastProperty?.location || 'Kilimani'
      })
    },
    { id:'UPGRADE_TIER',       emoji:'👑', label:'Upgrade Tier',
      patterns:[/upgrade|switch.*tier|elite|vip|saferide|women.*only|campus|student.*ride/i],
      entities:(t)=>({ tier: _detectTier(t) })
    },
    { id:'TRIP_STATUS',        emoji:'📍', label:'Trip Status',
      patterns:[/where.*driver|how.*long|eta|arrive|status.*trip|track/i],
      entities:()=>({})
    },
    // AGENT
    { id:'CONTACT_AGENT',      emoji:'📞', label:'Contact Agent',
      patterns:[/call.*agent|contact.*agent|speak.*agent|agent.*number|agent.*phone/i],
      entities:(t)=>({ agent: _context.lastProperty?.agent || 'Sarah Kamau' })
    },
    // FOOD
    { id:'ORDER_FOOD',         emoji:'🍽️', label:'Order Food',
      patterns:[/order.*food|hungry|eat|lunch|dinner|breakfast|nyama|pizza|burger|ride.*plate|food.*delivery/i],
      entities:(t)=>({
        category: /nyama|choma/i.test(t)?'grill':/pizza/i.test(t)?'pizza':/burger/i.test(t)?'fast':'recommended',
        seg: ridePlateSeg
      })
    },
    // SHOP
    { id:'OPEN_SHOP',          emoji:'🛒', label:'Open Shop',
      patterns:[/shop|supermarket|grocery|naivas|carrefour|quickmart|buy.*food|get.*groceries/i],
      entities:()=>({})
    },
    // VIP
    { id:'VIP_CONCIERGE',      emoji:'🥂', label:'VIP Concierge',
      patterns:[/concierge|private.*viewing|off.*market|exclusive|vip.*service|elite.*experience/i],
      entities:()=>({ tier:'vip' })
    },
    // NAV
    { id:'NAVIGATE_HOME',      emoji:'🏠', label:'Go Home',     patterns:[/go.*home|home.*screen|^home$/i], entities:()=>({target:'home'})  },
    { id:'NAVIGATE_EXPLORE',   emoji:'🔍', label:'Explore',     patterns:[/explore|browse|search.*homes/i], entities:()=>({target:'explore'}) },
    { id:'NAVIGATE_INBOX',     emoji:'💬', label:'Open Inbox',  patterns:[/inbox|messages|chat/i],          entities:()=>({target:'inbox'})  },
    { id:'NAVIGATE_PROFILE',   emoji:'👤', label:'My Profile',  patterns:[/profile|my.*account|settings/i], entities:()=>({target:'profile'}) },
    { id:'NAVIGATE_WISHLIST',  emoji:'🤍', label:'Wishlist',    patterns:[/wishlist|saved|favourites/i],    entities:()=>({target:'wishlist'}) },
    // DRIVER
    { id:'DRIVER_ACCEPT',  emoji:'✅', label:'Accept Ride',   patterns:[/accept.*ride|yes.*ride|take.*ride/i],  entities:()=>({}) },
    { id:'DRIVER_START',   emoji:'▶️', label:'Start Trip',    patterns:[/start.*trip|begin.*trip|go/i],         entities:()=>({}) },
    { id:'DRIVER_ARRIVED', emoji:'📍', label:'Arrived',       patterns:[/arriv|i.*here|reach/i],               entities:()=>({}) },
    { id:'DRIVER_COMPLETE',emoji:'🏁', label:'Complete Trip', patterns:[/complet|done|finish|end.*trip/i],      entities:()=>({}) },
  ];

  function _detectTier(t) {
    if (/elite|vip|private|luxury|premium/i.test(t))   return 'vip';
    if (/saferide|women|female|ladies/i.test(t))        return 'women';
    if (/student|campus|cheap|budget|afford/i.test(t)) return 'student';
    return 'general';
  }

  /* Classify transcript → {intent, confidence, entities} */
  function _classify(text) {
    let best = null, bestScore = 0;
    for (const intent of INTENTS) {
      for (const pat of intent.patterns) {
        if (pat.test(text)) {
          // Score: longer match = higher confidence
          const score = 0.75 + Math.min((text.length / 80) * 0.2, 0.22);
          if (score > bestScore) { bestScore = score; best = intent; }
        }
      }
    }
    if (!best) return { intent:'UNKNOWN', confidence:0, entities:{} };
    return {
      intent:     best.id,
      emoji:      best.emoji,
      label:      best.label,
      confidence: Math.min(bestScore, 0.99),
      entities:   best.entities(text)
    };
  }

  /* ── L3: CONTEXT ENGINE ────────────────────────────── */
  function _snapContext() {
    _context = {
      screen:        currentScreen,
      segment:       (typeof ridePlateSeg !== 'undefined') ? ridePlateSeg : 'general',
      tier:          (typeof selectedTier  !== 'undefined') ? selectedTier : null,
      lastProperty:  (typeof currentDetail !== 'undefined') ? detailData[currentDetail] : null,
      wishlistCount: (typeof wishlist !== 'undefined') ? wishlist.length : 0,
      bookedCount:   (typeof bookedTrips !== 'undefined') ? bookedTrips.length : 0,
      hour:          new Date().getHours(),
      isAgent:       (typeof isAgent !== 'undefined') ? isAgent : false,
    };
  }

  /* ── L4: EXECUTION ENGINE ──────────────────────────── */
  const EXEC = {
    PROPERTY_SEARCH(e) {
      const parts = [];
      if (e.location) parts.push(`in ${e.location}`);
      if (e.bedrooms) parts.push(`${e.bedrooms}-bedroom`);
      if (e.type)     parts.push(e.type);
      const desc = parts.join(' ') || 'all listings';
      goTo('explore');
      return {
        title: `Searching ${desc}`,
        body:  `Found 6 matching properties. Showing results in Explore.`,
        actions: [
          { label:'View Results 🔍', fn:"goTo('explore')" },
          { label:'Book a Viewing 📅', fn:"goTo('detail')" }
        ],
        speech: `I found properties ${desc}. Opening Explore now.`
      };
    },
    BOOK_VIEWING(e) {
      if (_context.lastProperty) {
        return {
          title: 'Booking Viewing',
          body:  `Scheduling a viewing for ${_context.lastProperty.title} — agent ${_context.lastProperty.agent} will be notified.`,
          actions: [{ label:'Confirm Booking ✅', fn:'bookViewing()' }],
          speech: `Booking a viewing for ${_context.lastProperty.title}. Please confirm.`
        };
      }
      goTo('explore');
      return { title:'Select a Property', body:'Browse a property first, then say "Book viewing."', speech:'Please select a property first.' };
    },
    BOOK_RIDE(e) {
      goTo('ride');
      return {
        title: `Booking ${e.tier === 'vip' ? '👑 Elite Tour' : e.tier === 'women' ? '🌸 SafeRide' : '🚗 Ride'}`,
        body:  `Opening Ride2Go. ${_context.lastProperty ? `Destination: ${_context.lastProperty.location}.` : 'Set your destination.'}`,
        actions: [{ label:'Choose Tier 🚀', fn:'openTierSelect()' }],
        speech: `Opening Ride to Go. ${_context.lastProperty ? `I\'ll set your destination to ${_context.lastProperty.title}.` : 'Please choose your ride tier.'}`
      };
    },
    UPGRADE_TIER(e) {
      selectTier(e.tier || 'vip');
      const names = {vip:'Elite Tour 👑',women:'SafeRide Women 🌸',student:'Campus Ride 🎓',general:'General Ride 🚗'};
      return {
        title: `Tier: ${names[e.tier||'vip']}`,
        body:  `Upgraded to ${names[e.tier||'vip']}. Pricing and perks updated.`,
        actions:[{ label:'Confirm Ride ✅', fn:'confirmTierRide()'}],
        speech:`Switched to ${names[e.tier||'vip'].replace(/[^\w\s]/g,'')}.`
      };
    },
    TRIP_STATUS() {
      return {
        title:'Trip Status',
        body: _context.bookedCount ? `You have ${_context.bookedCount} booked viewing${_context.bookedCount>1?'s':''}. Driver ETA: 4 min.` : 'No active trips. Book a ride to get started.',
        actions:[{ label:'View Trips 🗓️', fn:"goTo('trips')" }],
        speech: _context.bookedCount ? `Your driver will arrive in 4 minutes.` : `No active trips found.`
      };
    },
    CONTACT_AGENT(e) {
      goTo('inbox');
      return {
        title:`Connecting to ${e.agent}`,
        body:`Opening chat with ${e.agent}. You can also call directly.`,
        actions:[{ label:'Open Inbox 💬', fn:"goTo('inbox')" },{ label:'Call Agent 📞', fn:`toast('📞 Calling ${e.agent}…')` }],
        speech:`Connecting you to ${e.agent} now.`
      };
    },
    ORDER_FOOD(e) {
      if (typeof ridePlateSeg !== 'undefined') ridePlateSeg = e.seg||'general';
      if (typeof ridePlateCategory !== 'undefined') ridePlateCategory = e.category||'recommended';
      goTo('shop');
      return {
        title:'Ride Plate 🍽️',
        body:`Opening ${e.category||'recommended'} food options for you.`,
        actions:[{ label:'Browse Food 🍽️', fn:"goTo('shop')" }],
        speech:`Opening Ride Plate. Showing ${e.category||'recommended'} options near your route.`
      };
    },
    OPEN_SHOP() {
      goTo('shop');
      return { title:'Shop 🛒', body:'Opening supermarket & grocery options.', actions:[], speech:'Opening the Shop screen.' };
    },
    VIP_CONCIERGE() {
      selectTier('vip');
      goTo('ride');
      return {
        title:'👑 Elite Concierge',
        body:'VIP Elite mode activated. Your private concierge is available. Off-market listings unlocked.',
        actions:[{ label:'View Elite Listings ✦', fn:"openDetail('villa')" },{ label:'Book Private SUV 🚘', fn:"confirmTierRide()" }],
        speech:'VIP Elite mode activated. Your concierge is ready.'
      };
    },
    NAVIGATE_HOME()     { goTo('home');     return { title:'Home',     body:'Opening Home screen.',     speech:'Going home.',         actions:[] }; },
    NAVIGATE_EXPLORE()  { goTo('explore');  return { title:'Explore',  body:'Opening Explore.',         speech:'Opening Explore.',    actions:[] }; },
    NAVIGATE_INBOX()    { goTo('inbox');    return { title:'Inbox',    body:'Opening your messages.',   speech:'Opening Inbox.',      actions:[] }; },
    NAVIGATE_PROFILE()  { goTo('profile');  return { title:'Profile',  body:'Opening your profile.',    speech:'Opening your profile.',actions:[] }; },
    NAVIGATE_WISHLIST() { goTo('wishlist'); return { title:'Wishlist', body:'Opening saved properties.',speech:'Opening your wishlist.',actions:[] }; },
    DRIVER_ACCEPT()  { toast('✅ Ride accepted!');   return { title:'Ride Accepted', body:'Navigating to pickup.',     speech:'Ride accepted. Navigating to pickup.',actions:[] }; },
    DRIVER_START()   { toast('▶️ Trip started!');    return { title:'Trip Started',  body:'Trip timer running.',       speech:'Trip started.',actions:[] }; },
    DRIVER_ARRIVED() { toast('📍 Marked as arrived!');return {title:'Arrived',body:'Client notified.',speech:'Marked as arrived. Client notified.',actions:[] }; },
    DRIVER_COMPLETE(){ return { title:'Trip Complete 🏁', body:'Payment processing. Rating request sent.',speech:'Trip complete. Payment processing.',actions:[{label:'View Earnings 💰',fn:"toast('Opening earnings…')"}] }; },
    UNKNOWN()        { return { title:'Not sure', body:'Try: "Find a house in Kilimani", "Book a ride", or "Order food".', speech:'I didn\'t catch that. Try asking about properties, rides, or food.',actions:[] }; },
  };

  /* ── L5: RESPONSE ENGINE ───────────────────────────── */
  function _respond(result) {
    // Visual
    const chip = document.getElementById('voice-intent-chip');
    const respCard = document.getElementById('voice-response-card');
    if (chip && result.intent !== 'UNKNOWN') {
      chip.style.display = 'flex';
      document.getElementById('voice-intent-emoji').textContent = result.emoji||'✨';
      document.getElementById('voice-intent-label').textContent = result.label||result.intent;
      document.getElementById('voice-intent-conf').textContent  = `Confidence: ${Math.round(result.confidence*100)}%`;
      document.getElementById('voice-conf-fill').style.width    = (result.confidence*100)+'%';
    }
    // Execute
    const execFn = EXEC[result.intent] || EXEC.UNKNOWN;
    const resp   = execFn(result.entities||{});
    if (respCard) {
      respCard.style.display = 'block';
      document.getElementById('voice-resp-title').textContent = resp.title;
      document.getElementById('voice-resp-body').textContent  = resp.body;
      const actDiv = document.getElementById('voice-resp-actions');
      if (actDiv && resp.actions?.length) {
        actDiv.innerHTML = resp.actions.map(a=>`
          <button onclick="${a.fn};VI.close()" style="background:var(--brand,#1A4A2E);color:white;border:none;border-radius:10px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${a.label}</button>
        `).join('');
      }
    }
    // Speech (L5)
    _speak(resp.speech, result.intent);
    // Analytics
    _sessionLog.push({ ts:Date.now(), intent:result.intent, confidence:result.confidence, transcript:_lastResult });
    // Status
    _setStatus('✓ ' + (resp.title||'Done'));
  }

  /* TTS with segment-aware voice style */
  function _speak(text, intent) {
    if (!_synth || !text) return;
    _synth.cancel();
    const u   = new SpeechSynthesisUtterance(text);
    const seg = _context.segment||'general';
    // Segment voice tuning
    if (seg === 'vip')     { u.rate=0.88; u.pitch=0.90; }  // Concierge: slow, deep
    else if (seg==='women'){ u.rate=0.95; u.pitch=1.05; }  // Calm, warm
    else if (seg==='student'){u.rate=1.05; u.pitch=1.0; }  // Energetic
    else                   { u.rate=1.0;  u.pitch=1.0; }   // Neutral
    u.volume = 0.9;
    u.lang   = 'en-GB';
    // Pick best available voice
    const voices = _synth.getVoices();
    const pref = voices.find(v=>/google|samantha|female|zira/i.test(v.name)) || voices[0];
    if (pref) u.voice = pref;
    _synth.speak(u);
  }

  /* ── L1: SPEECH RECOGNITION ────────────────────────── */
  function _initSR() {
    const _SR2 = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.continuous    = false;
    r.interimResults= true;
    r.lang          = 'en-KE';   // Kenyan English first
    r.maxAlternatives = 3;
    r.onstart   = () => { _listening=true; _pulse(true); _setStatus('Listening…'); };
    r.onend     = () => { _listening=false; _pulse(false); _setStatus(_lastResult ? '✓ Heard' : 'Tap to speak'); document.getElementById('voice-mic-btn').textContent='🎤'; };
    r.onerror   = (ev) => { _listening=false; _pulse(false); _setStatus(ev.error==='not-allowed'?'Mic blocked — allow access':'Try again'); };
    r.onresult  = (ev) => {
      let interim='', final='';
      for (let i=ev.resultIndex;i<ev.results.length;i++) {
        if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      const heard = (final||interim).trim();
      document.getElementById('voice-transcript').textContent = heard;
      if (final) {
        _lastResult = final.trim();
        _setStatus('Processing…');
        _snapContext();
        const result = _classify(_lastResult);
        setTimeout(() => _respond(result), 150);
      }
    };
    return r;
  }

  /* Visual helpers */
  function _pulse(on) {
    const orb = document.getElementById('voice-orb');
    const btn = document.getElementById('voice-mic-btn');
    if (!orb) return;
    if (on) {
      orb.style.boxShadow = '0 0 0 20px rgba(26,74,46,.15), 0 0 0 40px rgba(26,74,46,.06)';
      orb.textContent = '🔴';
      if (btn) btn.textContent = '⏹';
    } else {
      orb.style.boxShadow = '0 0 0 0 rgba(26,74,46,.4)';
      orb.textContent = '🎤';
      if (btn) btn.textContent = '🎤';
    }
  }
  function _setStatus(msg) {
    const s = document.getElementById('voice-status');
    if (s) s.textContent = msg;
  }

  /* Suggestions based on context */
  function _renderSuggestions() {
    _snapContext();
    const seg = _context.segment || 'general';
    const sugs = {
      general: ['Find house in Kilimani','Book a ride','Order nyama choma','Open shop'],
      women:   ['Find safe apartment','SafeRide Women','Healthy food nearby','Contact agent'],
      student: ['Cheap bedsitter','Campus Ride','Meals under 300','Late night food'],
      vip:     ['Private villa viewing','Elite concierge','Fine dining nearby','Off-market listings'],
    };
    const list = sugs[seg]||sugs.general;
    const el = document.getElementById('voice-suggestions');
    if (!el) return;
    el.innerHTML = list.map(s=>`
      <div onclick="VI.runText('${s}')"
        style="background:var(--surface,#f9f9fb);border:.5px solid var(--border,rgba(0,0,0,.1));border-radius:100px;padding:7px 13px;font-size:11px;font-weight:600;color:var(--ink2,#666);cursor:pointer;white-space:nowrap">
        ${s}
      </div>`).join('');
    // Segment label
    const lbl = document.getElementById('voice-segment-label');
    const lbls = {general:'General Mode',women:'SafeRide Mode',student:'Student Mode',vip:'Elite Concierge Mode'};
    if (lbl) lbl.textContent = lbls[seg]||'General Mode';
  }

  /* Driver command handler */
  function driverCmd(text) {
    const dv = document.getElementById('driver-voice-overlay');
    document.getElementById('dv-transcript').textContent = text;
    document.getElementById('dv-status').textContent = 'Processing…';
    const result = _classify(text);
    const execFn = EXEC[result.intent] || EXEC.UNKNOWN;
    const resp   = execFn({});
    _speak(resp.speech, result.intent);
    document.getElementById('dv-title').textContent  = resp.title;
    document.getElementById('dv-status').textContent = resp.body;
    setTimeout(() => {
      document.getElementById('dv-status').textContent = 'Tap a command or say it';
      document.getElementById('dv-transcript').textContent = '';
    }, 3000);
    // Also fire toast in main app
    toast(`🎤 Driver: ${resp.title}`);
  }

  /* ── PUBLIC API ─────────────────────────────────────── */
  return {
    open() {
      _snapContext();
      _renderSuggestions();
      const el = document.getElementById('voice-overlay');
      if (el) { el.style.display='flex'; _open=true; }
      // Reset UI
      ['voice-intent-chip','voice-response-card'].forEach(id=>{
        const e=document.getElementById(id); if(e) e.style.display='none';
      });
      document.getElementById('voice-transcript').textContent='';
      _setStatus('Tap the mic to speak');
    },
    close() {
      VoiceAnalytics.endSession();
      const el=document.getElementById('voice-overlay');
      if(el){ el.style.display='none'; _open=false; }
      if (_sr) try{ _sr.abort(); }catch(e){}
      _listening=false; _pulse(false);
      if(_synth) _synth.cancel();
    },
    toggleMic() {
      if (_listening) { try{_sr?.stop();}catch(e){} return; }
      _sr = _initSR();
      if (!_sr) {
        _setStatus('Speech not supported — try Chrome');
        toast('⚠️ Voice requires Chrome or Edge');
        return;
      }
      document.getElementById('voice-transcript').textContent='';
      ['voice-intent-chip','voice-response-card'].forEach(id=>{
        const e=document.getElementById(id); if(e) e.style.display='none';
      });
      try { _sr.start(); }
      catch(e){ _setStatus('Mic error — reload page'); }
    },
    /* Run text directly (for suggestion taps) */
    runText(text) {
      document.getElementById('voice-transcript').textContent = text;
      _lastResult = text;
      _setStatus('Processing…');
      _snapContext();
      const result = _classify(text);
      setTimeout(() => _respond(result), 100);
    },
    driverCmd,
    openDriverMode() {
      const dv = document.getElementById('driver-voice-overlay');
      if(dv){ dv.style.display='flex'; }
    },
    /* Analytics getter */
    getAnalytics() {
      const total = _sessionLog.length;
      const resolved = _sessionLog.filter(l=>l.intent!=='UNKNOWN').length;
      return {
        total_commands: total,
        resolved,
        unresolved: total-resolved,
        resolution_rate: total ? Math.round(resolved/total*100)+'%' : '—',
        intents: _sessionLog.map(l=>l.intent),
        avg_confidence: total ? (_sessionLog.reduce((s,l)=>s+l.confidence,0)/total).toFixed(2) : '—'
      };
    }
  };
})();

  renderProfile();

    const n = new Date();
    el.textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }
  tickClock();
  setInterval(tickClock, 30000);
})();

function r2gFindRide() {
  const dest = document.getElementById('r2g-dest');
  const destVal = dest ? dest.value.trim() : '';
  R2G.dest = destVal || 'Kilimani, Nairobi';
  R2G.pickup = (document.getElementById('r2g-pickup') || {}).value || 'Westlands, Nairobi';

  // Update route bar
  const rbP = document.getElementById('r2g-rb-pickup');
  const rbD = document.getElementById('r2g-rb-dest');
  if (rbP) rbP.textContent = R2G.pickup.split(',')[0];
  if (rbD) rbD.textContent = R2G.dest.split(',')[0];

  // AI recommend
  const tier = R2G.aiRecommend();
  R2G.updateRecCard(tier);

  // Loading animation on button

      txt.textContent = 'Find Ride';

function r2gBack() {
  if (R2G.parcelOpen) { r2gCloseParcel(); return; }
  if (R2G.rpOpen) { r2gCloseRP(); return; }
  if (R2G.optionsOpen) { r2gOpenOptions(); return; } // closes it
  if (R2G.screen === 2) { R2G.show(1); return; }
  if (R2G.screen === 3) { R2G.show(2); return; }
  goTo('home');
}

function r2gSelectTransport(key, el) {

     Layer: Voice Input UI + Overlay
