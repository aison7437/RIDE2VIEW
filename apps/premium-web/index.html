<!-- Floating Mic FAB removed — mic now lives only inside search bars -->

<!-- Voice Overlay Sheet -->
<div id="voice-overlay" role="dialog" aria-modal="true" onclick="if(event.target===this)voiceClose()">
  <div class="voice-sheet seg-general" id="voice-sheet">
    <div class="voice-handle"></div>

    <!-- Waveform -->
    <div class="voice-wave" id="voice-wave">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <!-- Status -->
    <div class="voice-status" id="voice-status">Tap to speak</div>
    <div class="voice-transcript" id="voice-transcript">Say a command or tap a suggestion below</div>

    <!-- Result card -->
    <div class="voice-result" id="voice-result">
      <div class="vr-intent" id="vr-intent">Intent</div>
      <div class="vr-action" id="vr-action">Action</div>
      <button class="vr-btn" id="vr-btn" onclick="VIS.inject(document.getElementById('voice-transcript')?.textContent||'book a ride')">Execute →</button>
    </div>

    <!-- Contextual suggestions -->
    <div class="voice-suggestions" id="voice-suggestions"></div>

    <!-- Listen / Close -->
    <button id="voice-listen-btn"
      style="width:100%;padding:15px;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;background:var(--brand,#1A4A2E);color:white;box-shadow:0 4px 14px rgba(26,74,46,.3)"
      onclick="VIS.toggleListen()">
      🎙️ Listen
    </button>
    <button class="voice-close-btn" onclick="voiceClose()">Dismiss</button>
  </div>
</div>

<!-- Secure account access is served through the same-origin Vercel auth proxy. -->
<button id="r2v-auth-open" type="button" aria-haspopup="dialog">Sign in</button>
<dialog id="r2v-auth-dialog" aria-labelledby="r2v-auth-title">
 <div class="r2v-auth-shell">
  <button id="r2v-auth-close" class="r2v-auth-close" type="button" aria-label="Close account window">×</button>
  <h2 id="r2v-auth-title">Your Ride2View account</h2>
  <p id="r2v-auth-status" role="status" aria-live="polite">Choose email and password or verify a Kenyan phone number.</p>
  <form id="r2v-auth-login" class="r2v-auth-form">
   <h3>Sign in with email</h3><label>Email<input name="email" type="email" required autocomplete="username"></label>
   <label>Password<input name="password" type="password" required minlength="12" autocomplete="current-password"></label><button type="submit">Sign in</button>
  </form>
  <details><summary>Create account with email</summary><form id="r2v-auth-email-register" class="r2v-auth-form">
   <label>Full name<input name="name" required minlength="2" maxlength="100" autocomplete="name"></label>
   <label>Email<input name="email" type="email" required autocomplete="email"></label>
   <label>Password<input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
   <label>Account type<select name="role"><option value="customer">Customer</option><option value="agent">Property agent</option><option value="driver">Driver</option></select></label><button type="submit">Send email code</button>
  </form></details>
  <details><summary>Forgot your password?</summary><form id="r2v-auth-recovery" class="r2v-auth-form">
   <label>Email<input name="email" type="email" required autocomplete="email"></label><label>New password<input name="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><button type="submit">Verify email and reset password</button>
  </form></details>
  <details><summary>Register or sign in with Kenyan phone</summary><form id="r2v-auth-phone-register" class="r2v-auth-form">
   <label>Name for a new account<input name="name" minlength="2" maxlength="100" autocomplete="name"></label>
   <label>Phone number<input name="phone" type="tel" required autocomplete="tel" placeholder="0712 345 678"></label>
   <label>Account type<select name="role"><option value="customer">Customer</option><option value="agent">Property agent</option><option value="driver">Driver</option></select></label><button type="submit">Send SMS code</button>
  </form></details>
  <form id="r2v-auth-verify" class="r2v-auth-form" hidden>
   <label>Six-digit verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button type="submit">Verify and continue</button>
  </form>
  <section id="r2v-auth-account" hidden><p id="r2v-auth-user"></p>
   <details id="r2v-auth-link"><summary>Link another sign-in method</summary>
    <form id="r2v-auth-email-link" class="r2v-auth-form"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>New password<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button type="submit">Verify and link email</button></form>
    <form id="r2v-auth-phone-link" class="r2v-auth-form"><label>Kenyan phone number<input name="phone" type="tel" required autocomplete="tel"></label><button type="submit">Verify and link phone</button></form>
   </details><button id="r2v-auth-logout" type="button">Sign out</button>
  </section>
 </div>
</dialog>
<style>
#r2v-auth-open{position:fixed;right:18px;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:1000;border:0;border-radius:999px;padding:11px 17px;background:var(--brand,#1A4A2E);color:#fff;font:600 14px 'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.2);cursor:pointer}
#r2v-auth-dialog{width:min(440px,calc(100vw - 28px));max-height:min(86dvh,760px);padding:0;border:1px solid var(--border,rgba(26,74,46,.13));border-radius:22px;background:var(--card,#fff);color:var(--ink,#0D1F16);box-shadow:0 24px 80px rgba(0,0,0,.3)}
#r2v-auth-dialog::backdrop{background:rgba(8,18,12,.58);backdrop-filter:blur(3px)}
.r2v-auth-shell{position:relative;padding:26px;overflow:auto;max-height:inherit;box-sizing:border-box;font-family:'DM Sans',sans-serif}
.r2v-auth-shell h2{font:700 23px 'Playfair Display',serif;margin:4px 42px 8px 0;color:var(--ink,#0D1F16)}
.r2v-auth-shell p{font-size:13px;line-height:1.5;color:var(--ink2,#3D5248)}
.r2v-auth-close{position:absolute;right:18px;top:14px;border:0;background:transparent;color:var(--ink,#0D1F16);font-size:28px;cursor:pointer}
.r2v-auth-form{display:grid;gap:11px;margin:14px 0;padding:15px;border:1px solid var(--border,rgba(26,74,46,.13));border-radius:15px;background:var(--surface,#f6faf7)}
.r2v-auth-form h3{margin:0;font-size:15px}
.r2v-auth-form label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--ink2,#3D5248)}
.r2v-auth-form input,.r2v-auth-form select{box-sizing:border-box;width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--border,rgba(26,74,46,.2));border-radius:10px;background:var(--card,#fff);color:var(--ink,#0D1F16);font:inherit}
.r2v-auth-form button,#r2v-auth-account>button{min-height:42px;border:0;border-radius:11px;padding:10px 14px;background:var(--brand,#1A4A2E);color:#fff;font:600 13px 'DM Sans',sans-serif;cursor:pointer}
#r2v-auth-dialog details{margin:10px 0;padding:11px 13px;border:1px solid var(--border,rgba(26,74,46,.13));border-radius:13px}
#r2v-auth-dialog summary{cursor:pointer;font-size:13px;font-weight:700}
#r2v-auth-dialog[open]{animation:r2v-auth-in .16s ease-out}
@keyframes r2v-auth-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@media(max-width:560px){#r2v-auth-open{top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;padding:10px 14px}.r2v-auth-shell{padding:22px 18px}}

/* Ride2View premium visual refinement: cohesive image-led cards and clearer interaction states. */
:root { --r2v-card-shadow: 0 8px 24px rgba(13,31,22,.08); --r2v-card-shadow-hover: 0 14px 32px rgba(13,31,22,.14); }
.home-body, .browse-body { padding: 18px 16px 24px; }
.mode-grid { gap: 12px; margin-bottom: 22px; }
.mcard { min-height: 158px; border-radius: 20px; box-shadow: 0 12px 28px rgba(0,0,0,.18); isolation: isolate; }
.mcard .mc-bg { transition: transform .55s cubic-bezier(.2,.65,.3,1); }
.mcard.go .mc-overlay, .mcard.view .mc-overlay { background: linear-gradient(180deg,rgba(8,18,13,.04) 0%,rgba(8,18,13,.14) 34%,rgba(8,18,13,.78) 100%); }
.feat-card, .scard, .pcard, .wish-card, .tcard { border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--r2v-card-shadow); }
.feat-img, .scard-img, .pimg { background-color: var(--brand-faint); }
.feat-img img, .scard-img img, .pimg img, .dhero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pimg { height: 124px; }
.scard-img.tall { height: 168px; }
.feat-body, .scard-body, .pbody { padding: 12px 13px 14px; }
.ftitle, .sc-title, .pname { line-height: 1.4; }
.pprice, .sc-price { font-size: 14px; }
.search-bar { min-height: 48px; transition: box-shadow .2s ease, transform .2s ease; }
.search-mic { width: 34px; height: 34px; border-radius: 10px; }
.nav-item { min-height: 48px; justify-content: center; }
.dhero { height: 260px; background: var(--brand-faint); }
.dback, .hbtn2 { box-shadow: 0 3px 12px rgba(0,0,0,.14); }
@media (hover:hover) and (pointer:fine) {
  .mcard:hover, .feat-card:hover, .scard:hover, .pcard:hover, .tcard:hover { transform: translateY(-3px); box-shadow: var(--r2v-card-shadow-hover); }
  .search-bar:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,.16); }
}
:where(button,a,.nav-item,.search-mic,.mcard,.feat-card,.scard,.pcard,.tcard):focus-visible { outline: 3px solid var(--brand-light); outline-offset: 3px; }
@media (max-width:360px) { .home-body,.browse-body { padding-inline:12px; } .mode-grid { gap:9px; } .mcard { min-height:144px; } .pimg { height:112px; } }
@media (prefers-reduced-motion:reduce) {
  .mcard,.mcard .mc-bg,.feat-card,.scard,.pcard,.tcard,.search-bar { transition:none!important; }
  .mcard:hover,.feat-card:hover,.scard:hover,.pcard:hover,.tcard:hover,.search-bar:hover { transform:none; }
}
</style>
<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id),dialog=$('r2v-auth-dialog'),status=$('r2v-auth-status');let challengeId=null,user=null;
 async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Request failed');return data}
 function formData(form){return Object.fromEntries(new FormData(form))}
 function report(message){status.textContent=message}
 function renderAccount(){const signed=Boolean(user);$('r2v-auth-login').hidden=signed;document.querySelectorAll('#r2v-auth-dialog>div>details').forEach(d=>d.hidden=signed);$('r2v-auth-account').hidden=!signed;if(signed){$('r2v-auth-user').textContent=[user.name,user.role,user.email,user.phone].filter(Boolean).join(' · ');$('r2v-auth-email-link').hidden=Boolean(user.email);$('r2v-auth-phone-link').hidden=Boolean(user.phone);$('r2v-auth-link').hidden=Boolean(user.email&&user.phone)}}
 async function start(path,form,channel){const result=await api(path,'POST',formData(form));challengeId=result.challengeId;$('r2v-auth-verify').hidden=false;report('Enter the six-digit code sent by '+channel+'. It expires in five minutes.')}
 $('r2v-auth-open').addEventListener('click',async()=>{dialog.showModal();try{user=await api('auth/me');renderAccount();report('You are signed in.')}catch{user=null;renderAccount();try{const c=await api('config');report(c.authVerificationEnabled?'Choose email/password or Kenyan phone verification.':'Verification providers are not configured yet.')}catch(e){report(e.message)}}});
 $('r2v-auth-close').addEventListener('click',()=>dialog.close());
 $('r2v-auth-login').addEventListener('submit',async e=>{e.preventDefault();try{user=await api('auth/login','POST',formData(e.target));renderAccount();report('Signed in successfully.')}catch(x){report(x.message)}});
 $('r2v-auth-email-register').addEventListener('submit',async e=>{e.preventDefault();try{await start('auth/email/challenges',e.target,'email');}catch(x){report(x.message)}});
 $('r2v-auth-recovery').addEventListener('submit',async e=>{e.preventDefault();try{await start('auth/email/recovery/challenges',e.target,'email');}catch(x){report(x.message)}});
 $('r2v-auth-phone-register').addEventListener('submit',async e=>{e.preventDefault();try{await start('auth/phone/challenges',e.target,'SMS');}catch(x){report(x.message)}});
 $('r2v-auth-email-link').addEventListener('submit',async e=>{e.preventDefault();try{await start('auth/email/link/challenges',e.target,'email');}catch(x){report(x.message)}});
 $('r2v-auth-phone-link').addEventListener('submit',async e=>{e.preventDefault();try{await start('auth/phone/link/challenges',e.target,'SMS');}catch(x){report(x.message)}});
 $('r2v-auth-verify').addEventListener('submit',async e=>{e.preventDefault();try{if(!challengeId)throw new Error('Request a new code first');user=await api('auth/challenges/verify','POST',{challengeId,code:formData(e.target).code});challengeId=null;$('r2v-auth-verify').hidden=true;renderAccount();report('Contact verified. You are signed in.')}catch(x){report(x.message)}});
 $('r2v-auth-logout').addEventListener('click',async()=>{try{await api('auth/logout','POST',{});user=null;renderAccount();report('You are signed out.')}catch(x){report(x.message)}});
})();
</script>

</body>
